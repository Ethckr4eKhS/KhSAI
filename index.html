<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b12">
<title>4eKhSAI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#050b12;--gl:#ffffff0d;--ln:#ffffff1a;--tx:#e6f6fd;--mu:#7f9bad}
body{--c:#2de2c8}
body[data-s=listen]{--c:#f5c26b}
body[data-s=think]{--c:#a78bfa}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{height:100dvh;display:flex;flex-direction:column;color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(120% 70% at 50% 20%,#0b2f3b 0,var(--bg) 62%);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(#ffffff06 1px,transparent 1px) 0 0/100% 32px,linear-gradient(90deg,#ffffff06 1px,transparent 1px) 0 0/32px 100%;mask-image:radial-gradient(75% 60% at 50% 30%,#000,transparent)}
.scan{position:fixed;left:0;right:0;top:-140px;height:140px;pointer-events:none;background:linear-gradient(transparent,#3de0ff14,transparent);animation:sc 8s linear infinite}
@keyframes sc{to{transform:translateY(120vh)}}
.fr{position:fixed;inset:calc(8px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom));pointer-events:none;opacity:.5;background:linear-gradient(var(--c),var(--c)) 0 0/22px 1.5px,linear-gradient(var(--c),var(--c)) 0 0/1.5px 22px,linear-gradient(var(--c),var(--c)) 100% 0/22px 1.5px,linear-gradient(var(--c),var(--c)) 100% 0/1.5px 22px,linear-gradient(var(--c),var(--c)) 0 100%/22px 1.5px,linear-gradient(var(--c),var(--c)) 0 100%/1.5px 22px,linear-gradient(var(--c),var(--c)) 100% 100%/22px 1.5px,linear-gradient(var(--c),var(--c)) 100% 100%/1.5px 22px;background-repeat:no-repeat}
button,input,select{font:inherit;color:inherit}
header{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 20px 4px}
.brand{font-weight:800;font-size:19px;letter-spacing:.14em;background:linear-gradient(90deg,var(--tx),var(--c),var(--tx));background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:-220% 0}}
.chip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu);background:var(--gl);border:1px solid var(--ln);border-radius:99px;padding:5px 12px;backdrop-filter:blur(10px)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);animation:bl 1.6s ease-in-out infinite}
@keyframes bl{50%{opacity:.35}}
.ic{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--gl);border:1px solid var(--ln);cursor:pointer}
.ic svg{width:20px;height:20px;stroke:var(--tx);fill:none;stroke-width:2;stroke-linecap:round}
#vv,#cv{position:relative;flex:1;min-height:0;display:none;flex-direction:column;padding-bottom:78px}
body[data-v=vv] #vv{display:flex;align-items:center}
body[data-v=cv] #cv{display:flex}
#orb{flex:none;border:0;background:none;padding:0;margin:2px 0 0;line-height:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
#tel{flex:none;font:12px/1 ui-monospace,Menlo,monospace;letter-spacing:.18em;color:var(--c);opacity:.8;margin-top:2px}
#stat{flex:none;min-height:20px;margin:4px 18px 0;font-size:12px;color:var(--mu);text-align:center}
#cap{flex:1;min-height:0;width:100%;max-width:520px;padding:6px 26px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:8px;overflow:hidden}
#cq{color:var(--mu);font-size:15px;min-height:22px}
#ca{font-size:20px;line-height:1.4;font-weight:500;max-height:7.5em;overflow:hidden}
.chk{flex:none;display:flex;gap:8px;align-items:center;justify-content:center;color:var(--mu);font-size:14px;padding:4px 0}
#log{flex:1;min-height:0;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:12px;mask-image:linear-gradient(transparent,#000 18px)}
.m{max-width:86%;display:flex;flex-direction:column;gap:4px}
.bt{padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-break:break-word;border:1px solid var(--ln);backdrop-filter:blur(10px)}
.u{align-self:flex-end;align-items:flex-end}
.u .bt{background:linear-gradient(135deg,#2de2c828,#2de2c80d);border-color:#2de2c844;border-bottom-right-radius:6px}
.j{align-self:flex-start}
.j .bt{background:var(--gl);border-bottom-left-radius:6px;border-left:2px solid var(--c)}
.s{align-self:center;color:var(--mu);font-size:13px;text-align:center}
.mf{display:flex;gap:12px;font-size:11px;color:var(--mu);padding:0 6px}
.mf button{background:none;border:0;color:var(--c);padding:0;font-size:11px;cursor:pointer}
.dt i{display:inline-block;width:6px;height:6px;margin:3px 2px;border-radius:50%;background:var(--c);animation:dt 1s ease-in-out infinite}
.dt i:nth-child(2){animation-delay:.15s}.dt i:nth-child(3){animation-delay:.3s}
@keyframes dt{50%{transform:translateY(-4px);opacity:.35}}
#sg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 16px 10px}
#sg button{background:var(--gl);border:1px solid var(--ln);border-radius:99px;padding:8px 14px;font-size:14px;color:var(--tx);cursor:pointer}
#tf{display:flex;gap:8px;align-items:center;padding:6px 16px 4px}
#ti{flex:1;min-width:0;background:var(--gl);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;outline:0}
#ti:focus{border-color:var(--c)}
.rd{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--mu);gap:2px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:4px;padding:5px;border-radius:99px;background:#0b1824d9;border:1px solid var(--ln);backdrop-filter:blur(14px);z-index:5}
nav button{border:0;background:none;padding:10px 26px;border-radius:99px;color:var(--mu);font-weight:600;cursor:pointer;transition:.25s}
nav button.on{background:var(--c);color:#04121a}
#bd{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:.25s}
#set{position:fixed;left:0;right:0;bottom:0;max-height:88dvh;overflow-y:auto;background:#0b1824;border-top:1px solid var(--ln);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;transform:translateY(105%);transition:.3s}
.open #set{transform:none}.open #bd{opacity:1;pointer-events:auto}
#set h2{margin:0;font-size:17px}
#set label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mu)}
#set input[type=password],#set select{width:100%;background:var(--gl);border:1px solid var(--ln);border-radius:12px;padding:10px}
#set option{background:#0b1824}
.btn{background:var(--gl);border:1px solid var(--ln);border-radius:12px;padding:10px 14px;cursor:pointer}
.hd{display:flex;justify-content:space-between;align-items:center}
@media (prefers-reduced-motion:reduce){.scan,.brand,.chip::before,.dt i{animation:none}}
</style>
</head>
<body data-s="idle" data-v="vv">
<div class="scan"></div><div class="fr"></div>
<header>
  <div class="brand">4eKhSAI</div>
  <div class="chip" id="chip">Tayyor</div>
  <button class="ic" id="gear" aria-label="Sozlamalar"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
</header>
<div id="stat"></div>
<main id="vv">
  <button id="orb" aria-label="Gapirish"><canvas id="hud"></canvas></button>
  <div id="tel"></div>
  <div id="cap"><div id="cq"></div><div id="ca"></div></div>
  <label class="chk"><input type="checkbox" id="auto"> Doimiy suhbat</label>
</main>
<section id="cv">
  <div id="log"></div>
  <div id="sg"><button>Toshkentda ob-havo qanday?</button><button>Soat nechchi?</button><button>10 daqiqaga taymer qoʻy</button><button>Menga bir qiziq fakt ayt</button></div>
  <form id="tf"><input id="ti" type="text" placeholder="Xabar yozing…" autocomplete="off"><label class="rd"><input type="checkbox" id="rd">ovoz</label><button class="ic" aria-label="Yuborish"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form>
</section>
<nav id="nv"><button data-v="vv" class="on">Ovoz</button><button data-v="cv">Chat</button></nav>
<div id="wrap"><div id="bd"></div>
<div id="set">
  <div class="hd"><h2>Sozlamalar</h2><button class="btn" id="cl">Yopish</button></div>
  <label>Gemini API kaliti<input id="key" type="password" autocomplete="off" placeholder="AIza..."></label>
  <button class="btn" id="save">Saqlash va modellarni yuklash</button>
  <label>Model<select id="model"><option>gemini-flash-latest</option></select></label>
  <label>NeuronAI API kaliti<input id="nk" type="password" autocomplete="off" placeholder="nai_..."></label>
  <label>Ovoz<select id="nv"></select></label>
  <button class="btn" id="lv">Ovozlarni yuklash</button>
  <button class="btn" id="vt">Ovozni sinash</button>
  <button class="btn" id="mm">Xotira</button>
  <button class="btn" id="cc">Suhbatni tozalash</button>
  <button class="btn" id="inst" style="display:none">Ilova sifatida oʻrnatish</button>
</div></div>
<script>
const $ = id => document.getElementById(id), LS = window.localStorage;
const API = "https://generativelanguage.googleapis.com/v1beta/", TTS = "https://my.neuronai.uz/api/v1/tts";
const SYS = "Sen 4eKhSAI — foydalanuvchining shaxsiy ovozli yordamchisisan. Faqat oʻzbek tilida, lotin yozuvida gapir. Javoblaring ovozda aytiladi: qisqa (1–3 jumla), aniq va tabiiy boʻlsin; roʻyxat, belgi va emoji ishlatma. Foydalanuvchiga \"boss\" deb murojaat qil. Maslahat soʻralsa, aniq tavsiya ber. Ismingni faqat soʻralganda ayt.";
const g = (k, d) => LS.getItem(k) || d, sv = (k, v) => LS.setItem(k, v);
let key = g("k", ""), model = g("m", "gemini-flash-latest"), nkey = g("nk", ""), nvoice = g("nv", "kamron");
let hist = [], rec = null, S = "idle", aud = null, AC = null, an = null, fd = null, SP = null, mem = [];
try { mem = JSON.parse(g("mem", "[]")); } catch (e) {}
const sys = () => SYS + " Hozir: " + new Date().toLocaleString("en-GB", { dateStyle: "full", timeStyle: "short" }) + ". Nutq tanish xato qilishi mumkin: maʼnosini taxmin qil, juda tushunarsiz boʻlsa bitta qisqa savol ber. %, °C, $ va qisqartmalarni soʻz bilan yoz." + (mem.length ? " Foydalanuvchi haqida eslab qolganlaring: " + mem.join("; ") + "." : "") + " Kerak boʻlsa vositalardan foydalan: vaqt, ob-havo, taymer, internet qidiruvi. Foydalanuvchi oʻzi haqida doimiy muhim narsa aytsa (ism, oila, odat), remember vositasi bilan saqla.";
const upd = () => { $("mm").textContent = "Xotirani tozalash (" + mem.length + ")"; };
const LBL = { idle: "Tayyor", listen: "Tinglayapman", think: "Oʻylayapman", speak: "Gapiryapman" };
function setS(s) { S = s; document.body.dataset.s = s; $("chip").textContent = LBL[s]; }
function stat(t) { $("stat").textContent = t; }
let chat = []; try { chat = JSON.parse(g("chat", "[]")); } catch (e) {}
const saveChat = () => sv("chat", JSON.stringify(chat.slice(-60)));
function msg(c, t, ts) {
  const w = document.createElement("div"); w.className = "m " + c;
  if (c === "s") { w.textContent = t; $("log").appendChild(w); $("log").scrollTop = 1e9; return w; }
  const b = document.createElement("div"); b.className = "bt"; b.textContent = t; w.appendChild(b);
  const f = document.createElement("div"); f.className = "mf";
  f.innerHTML = "<span>" + new Date(ts || Date.now()).toTimeString().slice(0, 5) + "</span>";
  if (c === "j") {
    const a = document.createElement("button"); a.textContent = "Oʻqish"; a.onclick = () => { stopSpeak(); speak(b.textContent); };
    const k = document.createElement("button"); k.textContent = "Nusxa";
    k.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(b.textContent); k.textContent = "Nusxalandi"; setTimeout(() => k.textContent = "Nusxa", 1200); };
    f.append(a, k);
  }
  w.appendChild(f); $("log").appendChild(w); $("log").scrollTop = 1e9; $("sg").style.display = "none"; return b;
}
function say(t, c) {
  if (c === "s") { stat(t); return msg("s", t); }
  chat.push({ r: c, t, ts: Date.now() }); saveChat(); return msg(c, t);
}
function ready(n = true) {
  if (key && (!n || nkey || uzv())) return true;
  $("wrap").classList.add("open"); stat(key ? "NeuronAI kalitini kiriting." : "Avval Gemini kalitini kiriting."); return false;
}
function unlock() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch (e) {} }

async function loadModels() {
  if (!key) return;
  try {
    const r = await fetch(API + "models?pageSize=200", { headers: { "x-goog-api-key": key } });
    const j = await r.json();
    if (!r.ok) throw new Error((j.error && j.error.message) || r.status);
    const ms = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent")).map(m => m.name.replace("models/", ""));
    sv("ml", JSON.stringify(ms));
    const sel = $("model"); sel.innerHTML = "";
    ms.forEach(n => { const o = document.createElement("option"); o.value = o.textContent = n; sel.appendChild(o); });
    sel.value = ms.includes(model) ? model
      : (ms.find(n => n === "gemini-flash-latest") || ms.find(n => /flash/.test(n) && !/lite|image|tts|live|audio/.test(n)) || ms[0]);
    model = sel.value; sv("m", model);
    stat("Kalit qabul qilindi. Modellar yuklandi.");
  } catch (e) { stat("Kalit yoki model xatosi: " + e.message); }
}

async function loadVoices() {
  try {
    const r = await fetch(TTS + "/voices", { headers: nkey ? { Authorization: "Bearer " + nkey } : {} });
    const j = await r.json();
    if (!r.ok) throw new Error((j.error && j.error.message) || r.status);
    const a = (Array.isArray(j) ? j : (j.data || j.voices || j.items || [])).filter(v => v && (v.voice_id || v.id));
    if (!a.length) { stat("Ovozlar roʻyxati boʻsh."); return; }
    const sel = $("nv"); sel.innerHTML = "";
    a.forEach(v => { const id = v.voice_id || v.id, o = document.createElement("option"); o.value = id; o.textContent = (v.name || id) + (v.language ? " · " + v.language : ""); sel.appendChild(o); });
    sel.value = a.some(v => (v.voice_id || v.id) === nvoice) ? nvoice : (a[0].voice_id || a[0].id);
    nvoice = sel.value; sv("nv", nvoice);
    stat(a.length + " ta ovoz topildi.");
  } catch (e) { stat("Ovozlar xatosi: " + e.message); }
}

const FB = ["gemini-2.5-flash", "gemini-2.5-flash-lite"];
let ac = null;
const nap = t => new Promise(r => setTimeout(r, t));
const chain = () => { let ml = []; try { ml = JSON.parse(g("ml", "[]")); } catch (e) {} return [...new Set([model, ...FB, ...ml.filter(n => /flash/.test(n) && !/image|tts|live|audio|exp|8b|robotics|computer/.test(n))])].slice(0, 5); };
const textOf = j => ((j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || []).map(p => p.text || "").join("").trim();
const TOOLS = [{ functionDeclarations: [
  { name: "get_time", description: "Hozirgi sana, vaqt va vaqt mintaqasini qaytaradi" },
  { name: "get_weather", description: "Shaharning hozirgi ob-havosi (weather_code — WMO kodi)", parameters: { type: "object", properties: { city: { type: "string", description: "Shahar nomi lotin yozuvida, masalan Tashkent" } }, required: ["city"] } },
  { name: "set_timer", description: "Taymer qoʻyadi", parameters: { type: "object", properties: { seconds: { type: "integer" }, label: { type: "string" } }, required: ["seconds"] } },
  { name: "remember", description: "Foydalanuvchi haqidagi muhim faktni uzoq muddatga eslab qoladi", parameters: { type: "object", properties: { fact: { type: "string" } }, required: ["fact"] } },
  { name: "search_web", description: "Internetdan yangi maʼlumot qidiradi (yangiliklar, narxlar, faktlar)", parameters: { type: "object", properties: { query: { type: "string" } }, required: ["query"] } }
] }];
function alarm(l) {
  say("Taymer: " + l, "s"); beep();
  try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {}
  if ((nkey || uzv()) && S === "idle") setTimeout(() => speak("Boss, taymer tugadi. " + l), 1800);
}
const FN = {
  get_time: async () => ({ now: new Date().toString() }),
  get_weather: async ({ city }) => {
    const a = await (await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&name=" + encodeURIComponent(city))).json();
    const p = a.results && a.results[0]; if (!p) return { error: "shahar topilmadi" };
    const w = await (await fetch("https://api.open-meteo.com/v1/forecast?latitude=" + p.latitude + "&longitude=" + p.longitude + "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto")).json();
    return { city: p.name, country: p.country, ...w.current };
  },
  set_timer: async ({ seconds, label }) => { const n = Math.max(1, Math.min(+seconds || 0, 86400)), x = { id: Date.now(), at: Date.now() + n * 1000, l: label || "Vaqt tugadi" }; sv("tm", JSON.stringify([...tmGet(), x])); arm(x); return { ok: true, seconds: n }; },
  remember: async ({ fact }) => { mem = [...mem, String(fact).slice(0, 200)].slice(-30); sv("mem", JSON.stringify(mem)); upd(); return { ok: true }; },
  search_web: async ({ query }) => {
    const r = await fetch(API + "models/gemini-2.5-flash:generateContent", { method: "POST", headers: { "Content-Type": "application/json", "x-goog-api-key": key },
      body: JSON.stringify({ tools: [{ google_search: {} }], contents: [{ role: "user", parts: [{ text: query + "\n\nQisqa va aniq javob ber (3-4 jumla)." }] }] }) });
    const j = await r.json(); if (!r.ok) return { error: (j.error && j.error.message) || r.status };
    return { answer: textOf(j) };
  }
};

async function* sse(r) {
  const rd = r.body.getReader(), dec = new TextDecoder(); let b = "";
  for (;;) {
    const { done, value } = await rd.read(); if (done) break;
    b += dec.decode(value, { stream: true }); let i;
    while ((i = b.indexOf("\n")) >= 0) {
      const l = b.slice(0, i).trim(); b = b.slice(i + 1);
      if (l.startsWith("data:")) { try { yield JSON.parse(l.slice(5)); } catch (_) {} }
    }
  }
}
async function streamOnce(m, contents, onText) {
  const r = await fetch(API + "models/" + m + ":streamGenerateContent?alt=sse", {
    method: "POST", headers: { "Content-Type": "application/json", "x-goog-api-key": key },
    signal: ac && ac.signal,
    body: JSON.stringify({ systemInstruction: { parts: [{ text: sys() }] }, tools: TOOLS, contents, ...(/2\.5-flash/.test(m) ? { generationConfig: { thinkingConfig: { thinkingBudget: 0 } } } : {}) })
  });
  if (!r.ok) {
    let j = {}; try { j = await r.json(); } catch (_) {}
    const e = new Error((j.error && j.error.message) || r.status); e.busy = [404, 429, 500, 502, 503, 504].includes(r.status); throw e;
  }
  const parts = [];
  for await (const j of sse(r)) {
    const ps = (j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [];
    for (const p of ps) { parts.push(p); if (p.text && !p.thought) onText(p.text); }
  }
  return parts;
}
async function answer(q, onText) {
  const base = [...hist, { role: "user", parts: [{ text: q }] }], steps = []; let all = "";
  for (let n = 0; n < 4; n++) {
    const contents = base.concat(steps); let parts, last;
    for (let rd = 0; rd < 2 && !parts; rd++) {
      if (rd) { stat("Band, qayta urinyapman…"); await nap(1500); }
      for (const m of chain()) {
        let started = false;
        try { parts = await streamOnce(m, contents, t => { started = true; all += t; onText(t); }); break; }
        catch (e) { last = e; if (!e.busy || started) throw e; stat("Band, zaxira model: " + m); }
      }
    }
    if (!parts) throw last;
    const calls = parts.filter(p => p.functionCall);
    if (!calls.length) {
      hist = [...base, { role: "model", parts: [{ text: all || "..." }] }].slice(-16);
      while (hist.length && hist[0].role !== "user") hist.shift();
      return all;
    }
    steps.push({ role: "model", parts });
    const res = [];
    for (const c of calls) {
      const f = c.functionCall; stat("Vosita: " + f.name + "…"); let out;
      try { out = await FN[f.name](f.args || {}); } catch (e) { out = { error: e.message }; }
      res.push({ functionResponse: { name: f.name, response: out } });
    }
    steps.push({ role: "user", parts: res });
  }
  throw new Error("Vositalar tsikli tugamadi");
}

function hook(a) {
  an = fd = null;
  if (!AC || AC.state !== "running") return;
  try {
    const s = AC.createMediaElementSource(a), n = AC.createAnalyser();
    n.fftSize = 128; n.smoothingTimeConstant = .75;
    s.connect(n); n.connect(AC.destination);
    fd = new Uint8Array(n.frequencyBinCount); an = n;
  } catch (e) { an = fd = null; }
}
function takeSentences(buf, fin, min = 24) {

const uzv = () => { try { return speechSynthesis.getVoices().find(v => /^uz/i.test(v.lang)); } catch (e) { return null; } };

      catch (e) { aud = null; bad = !!uzv(); if (stopped || await native(it.t)) continue; if (!shown) { shown = true; say("Ovoz xatosi: " + e.message, "s"); } }
    }

}

async function turn(q, voice = true) {
  say(q, "u"); $("cq").textContent = q; $("ca").textContent = ""; setS("think");
  const d = msg("j", ""); d.innerHTML = '<span class="dt"><i></i><i></i><i></i></span>';

}

const CL = { idle: [45, 226, 200], listen: [245, 194, 107], think: [167, 139, 250], speak: [45, 226, 200] };
