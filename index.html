<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070d14">
<title>Jarvis</title>
<style>
:root{--bg:#070d14;--gl:#ffffff0d;--ln:#ffffff1a;--tx:#e6f6fd;--mu:#7f9bad}
body{--c:#3de0ff;--c2:#7a8cff}
body[data-s=listen]{--c:#ffb347;--c2:#ff7a59}
body[data-s=think]{--c:#a78bfa;--c2:#3de0ff}
body[data-s=speak]{--c:#4ade80;--c2:#3de0ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{height:100dvh;display:flex;flex-direction:column;color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(120% 70% at 50% -10%,#123452 0,var(--bg) 60%);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(#ffffff06 1px,transparent 1px) 0 0/100% 34px,linear-gradient(90deg,#ffffff06 1px,transparent 1px) 0 0/34px 100%;mask-image:radial-gradient(70% 55% at 50% 30%,#000,transparent)}
button,input,select{font:inherit;color:inherit}
header{position:relative;display:flex;align-items:center;justify-content:space-between;padding:14px 18px 4px}
.brand{font-weight:700;letter-spacing:.38em;font-size:15px}
.chip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu);background:var(--gl);border:1px solid var(--ln);border-radius:99px;padding:5px 12px;backdrop-filter:blur(10px)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.ic{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--gl);border:1px solid var(--ln);cursor:pointer}
.ic svg{width:20px;height:20px;stroke:var(--tx);fill:none;stroke-width:2;stroke-linecap:round}
main{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center}
#orb{position:relative;flex:none;width:210px;height:210px;margin:10px 0 0;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.core{position:absolute;inset:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,var(--c) 34%,#0b3f58 100%);box-shadow:0 0 50px var(--c),inset 0 0 22px #fff7;animation:br 3.4s ease-in-out infinite}
.r{position:absolute;border-radius:50%;border:1.5px solid var(--c)}
.r1{inset:30px;border-style:dashed;opacity:.55;animation:sp 10s linear infinite}
.r2{inset:12px;border-color:var(--c2) transparent;opacity:.45;animation:sp 15s linear infinite reverse}
.r3{inset:0;opacity:.18}
[data-s=listen] .core{animation:pl .9s ease-in-out infinite}
[data-s=think] .r1{animation-duration:1.5s}[data-s=think] .r2{animation-duration:2.2s}
[data-s=speak] .core{animation:pl .55s ease-in-out infinite}
[data-s=speak] .r3{animation:rp 1.2s ease-out infinite}
@keyframes br{50%{transform:scale(1.06)}}
@keyframes pl{50%{transform:scale(1.15)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes rp{from{transform:scale(.9);opacity:.5}to{transform:scale(1.28);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
#stat{flex:none;min-height:22px;margin:6px 18px 4px;font-size:13px;color:var(--mu);text-align:center}
#log{flex:1;min-height:0;width:100%;overflow-y:auto;padding:8px 16px 10px;display:flex;flex-direction:column;gap:10px;mask-image:linear-gradient(transparent,#000 22px)}
.m{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;border:1px solid var(--ln);backdrop-filter:blur(10px)}
.u{align-self:flex-end;background:#3de0ff1f;border-color:#3de0ff40}
.j{align-self:flex-start;background:var(--gl);border-left:2px solid var(--c)}
.s{align-self:center;color:var(--mu);font-size:14px;text-align:center;border:0;background:none}
footer{display:flex;flex-direction:column;gap:8px;padding:6px 16px 14px}
#tf{display:flex;gap:8px}
#ti{flex:1;min-width:0;background:var(--gl);border:1px solid var(--ln);border-radius:14px;padding:11px 14px;outline:0}
#ti:focus{border-color:var(--c)}
.chk{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--mu);font-size:14px}
#bd{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:.25s}
#set{position:fixed;left:0;right:0;bottom:0;max-height:88dvh;overflow-y:auto;background:#0d1a26;border-top:1px solid var(--ln);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;transform:translateY(105%);transition:.3s}
.open #set{transform:none}.open #bd{opacity:1;pointer-events:auto}
#set h2{margin:0;font-size:17px}
#set label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mu)}
#set input[type=password],#set input[type=text],#set select{width:100%;background:var(--gl);border:1px solid var(--ln);border-radius:12px;padding:10px}
#set option{background:#0d1a26}
.btn{background:var(--gl);border:1px solid var(--ln);border-radius:12px;padding:10px 14px;cursor:pointer}
.nai{display:none;flex-direction:column;gap:12px}.nai.on{display:flex}
.hd{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body data-s="idle">
<header>
  <div class="brand">JARVIS</div>
  <div class="chip" id="chip">Tayyor</div>
  <button class="ic" id="gear" aria-label="Sozlamalar"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
</header>
<main>
  <button id="orb" aria-label="Gapirish"><span class="r r3"></span><span class="r r2"></span><span class="r r1"></span><span class="core"></span></button>
  <div id="stat"></div>
  <div id="log"></div>
</main>
<footer>
  <form id="tf"><input id="ti" type="text" placeholder="Yoki shu yerga yozing…" autocomplete="off"><button class="ic" aria-label="Yuborish"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form>
  <label class="chk"><input type="checkbox" id="auto"> Doimiy suhbat</label>
</footer>
<div id="wrap"><div id="bd"></div>
<div id="set">
  <div class="hd"><h2>Sozlamalar</h2><button class="btn" id="cl">Yopish</button></div>
  <label>Gemini API kaliti<input id="key" type="password" autocomplete="off" placeholder="AIza..."></label>
  <button class="btn" id="save">Saqlash va modellarni yuklash</button>
  <label>Model<select id="model"><option>gemini-flash-latest</option></select></label>
  <label>Javob ovozi
    <select id="pv"><option value="phone">Telefon ovozi</option><option value="nai">NeuronAI (oʻzbek ovozi)</option></select>
  </label>
  <div class="nai" id="nai">
    <label>NeuronAI API kaliti<input id="nk" type="password" autocomplete="off" placeholder="nai_..."></label>
    <label>Ovoz (voice_id)<input id="nv" type="text" autocomplete="off"></label>
    <label>TTS manzili<input id="nu" type="text" autocomplete="off"></label>
  </div>
  <label>Telefon ovozi tili
    <select id="tl"><option value="uz-UZ">Oʻzbek (uz-UZ)</option><option value="tr-TR">Turk (tr-TR)</option><option value="ru-RU">Rus (ru-RU)</option><option value="en-US">Ingliz (en-US)</option></select>
  </label>
  <button class="btn" id="vt">Ovozni sinash</button>
</div></div>
<script>
const $ = id => document.getElementById(id), LS = window.localStorage;
const API = "https://generativelanguage.googleapis.com/v1beta/";
const SYS = "Sen Jarvis — foydalanuvchining shaxsiy ovozli yordamchisisan. Faqat oʻzbek tilida, lotin yozuvida gapir. Javoblaring ovozda aytiladi: qisqa (1–3 jumla), aniq va tabiiy boʻlsin; roʻyxat, belgi va emoji ishlatma. Foydalanuvchiga \"boss\" deb murojaat qil. Maslahat soʻralsa, aniq tavsiya ber.";
const g = (k, d) => LS.getItem(k) || d, sv = (k, v) => LS.setItem(k, v);
let key = g("k", ""), model = g("m", "gemini-flash-latest"), tl = g("tl", "uz-UZ");
let prov = g("pv", "phone"), nkey = g("nk", ""), nvoice = g("nv", "kamron"), nurl = g("nu", "https://my.neuronai.uz/api/v1/tts/synthesize");
if (/\/api\/v1\/tts\/?$/.test(nurl)) { nurl += (nurl.endsWith("/") ? "" : "/") + "synthesize"; sv("nu", nurl); }
let hist = [], rec = null, S = "idle", aud = null;
const LBL = { idle: "Tayyor", listen: "Tinglayapman", think: "Oʻylayapman", speak: "Gapiryapman" };
function setS(s) { S = s; document.body.dataset.s = s; $("chip").textContent = LBL[s]; }
function stat(t) { $("stat").textContent = t; }
function say(t, c) {
  const d = document.createElement("div");
  d.className = "m " + c; d.textContent = t;
  $("log").appendChild(d); $("log").scrollTop = 1e9;
}

async function loadModels() {
  if (!key) return;
  try {
    const r = await fetch(API + "models?pageSize=200", { headers: { "x-goog-api-key": key } });
    const j = await r.json();
    if (!r.ok) throw new Error((j.error && j.error.message) || r.status);
    const ms = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent")).map(m => m.name.replace("models/", ""));
    const sel = $("model"); sel.innerHTML = "";
    ms.forEach(n => { const o = document.createElement("option"); o.value = o.textContent = n; sel.appendChild(o); });
    sel.value = ms.includes(model) ? model
      : (ms.find(n => n === "gemini-flash-latest") || ms.find(n => /flash/.test(n) && !/lite|image|tts|live|audio/.test(n)) || ms[0]);
    model = sel.value; sv("m", model);
    stat("Kalit qabul qilindi. Modellar yuklandi.");
  } catch (e) { stat("Kalit yoki model xatosi: " + e.message); }
}

const FB = ["gemini-2.5-flash", "gemini-2.5-flash-lite"];
async function gen(m) {
  const r = await fetch(API + "models/" + m + ":generateContent", {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-goog-api-key": key },
    body: JSON.stringify({ systemInstruction: { parts: [{ text: SYS }] }, contents: hist })
  });
  const j = await r.json();
  if (!r.ok) { const e = new Error((j.error && j.error.message) || r.status); e.busy = [429, 500, 503].includes(r.status); throw e; }
  return j;
}
async function ask(text) {
  hist.push({ role: "user", parts: [{ text }] });
  hist = hist.slice(-16);
  while (hist.length && hist[0].role !== "user") hist.shift();
  let j, last;
  for (const m of [model, ...FB.filter(x => x !== model)]) {
    try { j = await gen(m); break; }
    catch (e) { last = e; if (!e.busy) break; stat("Band, zaxira model sinayapman…"); }
  }
  if (!j) { hist.pop(); throw last; }
  const a = ((j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [])
    .map(p => p.text || "").join("").trim() || "(javob kelmadi)";
  hist.push({ role: "model", parts: [{ text: a }] });
  return a;
}

function speakPhone(t) {
  return new Promise(res => {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = tl;
    const v = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace("_", "-").startsWith(tl.slice(0, 2).toLowerCase()));
    if (v) u.voice = v;
    stat("Ovoz: " + (v ? v.name + " (" + v.lang + ")" : "standart, " + tl + " topilmadi"));
    u.onend = u.onerror = () => res();
    speechSynthesis.speak(u);
  });
}
async function speakNai(t) {
  const r = await fetch(nurl, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + nkey },
    body: JSON.stringify({ text: t, voice_id: nvoice, language: "uz", quality: "standard" })
  });
  if (!r.ok) {
    let m = r.status;
    try { const j = await r.json(); m = (j.error && (j.error.message || j.error.code)) || j.message || m; } catch (_) {}
    throw new Error(m);
  }
  const b = await r.blob();
  stat("Ovoz: NeuronAI (" + nvoice + ")");
  await new Promise((res, rej) => {
    aud = new Audio(URL.createObjectURL(b));
    aud.onended = res; aud.onerror = () => rej(new Error("audio oʻynamadi"));
    aud.play().catch(rej);
  });
  aud = null;
}
async function speak(t) {
  const c = t.replace(/[*_#`]/g, "");
  setS("speak");
  if (prov === "nai" && nkey) {
    try { await speakNai(c); }
    catch (e) { aud = null; stat("NeuronAI xatosi: " + e.message + ". Telefon ovozi ishlatildi."); await speakPhone(c); }
  } else await speakPhone(c);
  setS("idle");
}
function stopSpeak() {
  speechSynthesis.cancel();
  if (aud) { aud.pause(); aud.dispatchEvent(new Event("ended")); }
}

async function turn(q) {
  say(q, "u"); setS("think");
  try { const a = await ask(q); say(a, "j"); await speak(a); }
  catch (e) { say("Xato: " + e.message, "s"); setS("idle"); return; }
  if ($("auto").checked) listen(); else stat("");
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function listen() {
  if (!SR) { stat("Bu brauzer nutq tanishni qoʻllamaydi. Chrome ishlating."); return; }
  if (!key) { $("wrap").classList.add("open"); stat("Avval API kalitni kiriting."); return; }
  speechSynthesis.cancel();
  rec = new SR(); rec.lang = "uz-UZ"; rec.interimResults = true; rec.continuous = false;
  let fin = "", err = "";
  rec.onstart = () => { setS("listen"); stat("Tinglayapman…"); };
  rec.onresult = e => { let t = ""; for (const r of e.results) t += r[0].transcript; fin = t; stat("… " + t); };
  rec.onerror = e => { err = (e.error === "no-speech" || e.error === "aborted") ? "" : e.error; if (err) stat("Nutq xatosi: " + err); };
  rec.onend = () => {
    if (err) { setS("idle"); return; }
    const q = fin.trim();
    if (!q) { setS("idle"); if ($("auto").checked) listen(); else stat("Hech narsa eshitilmadi."); return; }
    turn(q);
  };
  rec.start();
}

$("orb").onclick = () => {
  if (S === "think") return;
  if (S === "listen") rec.stop();
  else if (S === "speak") stopSpeak();
  else listen();
};
$("tf").onsubmit = e => { e.preventDefault(); const q = $("ti").value.trim(); if (!q || S === "think") return; if (!key) { $("wrap").classList.add("open"); return; } $("ti").value = ""; stopSpeak(); turn(q); };
$("gear").onclick = () => $("wrap").classList.add("open");
$("bd").onclick = $("cl").onclick = () => $("wrap").classList.remove("open");
$("save").onclick = () => { key = $("key").value.trim(); sv("k", key); loadModels(); };
$("model").onchange = () => { model = $("model").value; sv("m", model); };
$("tl").onchange = () => { tl = $("tl").value; sv("tl", tl); };
$("pv").onchange = () => { prov = $("pv").value; sv("pv", prov); $("nai").classList.toggle("on", prov === "nai"); };
$("nk").oninput = () => { nkey = $("nk").value.trim(); sv("nk", nkey); };
$("nv").oninput = () => { nvoice = $("nv").value.trim(); sv("nv", nvoice); };
$("nu").oninput = () => { nurl = $("nu").value.trim(); sv("nu", nurl); };
$("vt").onclick = () => { $("wrap").classList.remove("open"); speak("Salom, boss. Men Jarvisman. Ovoz ishlayapti."); };

$("key").value = key; $("tl").value = tl; $("pv").value = prov; $("nk").value = nkey; $("nv").value = nvoice; $("nu").value = nurl;
$("nai").classList.toggle("on", prov === "nai");
if (key) loadModels(); else $("wrap").classList.add("open");
say("Salom, boss. Aylanani bosing va gapiring, yoki pastga yozing.", "s");
</script>
</body>
</html>
